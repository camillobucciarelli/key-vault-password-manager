name: CLA Assistant

# pull_request_target is required: the action must write the signature file and
# a commit status, which the read-only token of a fork's pull_request lacks.
# Safe here because no step checks out or executes PR-authored code.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA signature
        if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/camillobucciarelli/key-vault-password-manager/blob/main/CLA.md'
          path-to-signatures: 'signatures/v1/cla.json'
          branch: 'cla-signatures'
          allowlist: camillobucciarelli,dependabot[bot],*[bot]
          custom-notsigned-prcomment: 'Grazie per il contributo. Prima del merge devi firmare la [CLA](https://github.com/camillobucciarelli/key-vault-password-manager/blob/main/CLA.md): serve a garantire che il progetto resti pubblicabile sugli app store sotto AGPL-3.0.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Tutti i contributor hanno firmato la CLA.'
          lock-pullrequest-aftermerge: false
