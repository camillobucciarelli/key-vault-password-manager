name: Build Multi-Platform Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
          - platform: macos
            os: macos-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
          - platform: browser-extension
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: matrix.platform != 'browser-extension'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        if: matrix.platform != 'browser-extension'
        run: flutter pub get

      - name: Create dart-define file
        if: matrix.platform != 'browser-extension'
        shell: bash
        run: |
          if [ -n "${{ secrets.DART_DEFINE_JSON }}" ]; then
            printf '%s' '${{ secrets.DART_DEFINE_JSON }}' > .env.dart.define.json
          elif [ -f .env.dart.define.example.json ]; then
            cp .env.dart.define.example.json .env.dart.define.json
          else
            printf '{}' > .env.dart.define.json
          fi

      - name: Build browser extension package
        if: matrix.platform == 'browser-extension'
        shell: bash
        run: |
          chmod +x desktop/browser_extension/package_extension.sh
          desktop/browser_extension/package_extension.sh

      - name: Build Android artifacts
        if: matrix.platform == 'android'
        run: |
          flutter build appbundle --release --dart-define-from-file=.env.dart.define.json
          flutter build apk --release --dart-define-from-file=.env.dart.define.json

      - name: Build iOS artifact
        if: matrix.platform == 'ios' && (secrets.IOS_DIST_CERT_P12_BASE64 == '' || secrets.IOS_DIST_CERT_PASSWORD == '' || secrets.IOS_KEYCHAIN_PASSWORD == '' || secrets.IOS_TEAM_ID == '' || secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 == '' || secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 == '')
        run: flutter build ios --release --no-codesign --dart-define-from-file=.env.dart.define.json

      - name: Set up iOS Ad Hoc signing
        if: matrix.platform == 'ios' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_KEYCHAIN_PASSWORD != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 != ''
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_APP_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 }}
          IOS_PROVISIONING_PROFILE_EXTENSION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          EXT_PROFILE_PATH="$RUNNER_TEMP/extension.mobileprovision"

          echo -n "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_APP_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_EXTENSION_BASE64" | base64 --decode > "$EXT_PROFILE_PATH"

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<<"$(security cms -D -i "$APP_PROFILE_PATH")")
          EXT_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<<"$(security cms -D -i "$EXT_PROFILE_PATH")")

          cp "$APP_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$APP_PROFILE_UUID.mobileprovision"
          cp "$EXT_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$EXT_PROFILE_UUID.mobileprovision"

          cat > ios/ExportOptions-ci.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>dev.camillobucciarelli.kdbxKeyVault</key>
              <string>$APP_PROFILE_UUID</string>
              <key>dev.camillobucciarelli.kdbxKeyVault.CredentialProviderExtension</key>
              <string>$EXT_PROFILE_UUID</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed iOS IPA (Ad Hoc)
        if: matrix.platform == 'ios' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_KEYCHAIN_PASSWORD != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 != ''
        run: flutter build ipa --release --dart-define-from-file=.env.dart.define.json --export-options-plist=ios/ExportOptions-ci.plist

      - name: Build macOS artifact
        if: matrix.platform == 'macos'
        run: flutter build macos --release --dart-define-from-file=.env.dart.define.json

      - name: Build Windows artifact
        if: matrix.platform == 'windows'
        run: flutter build windows --release --dart-define-from-file=.env.dart.define.json

      - name: Build Linux artifact
        if: matrix.platform == 'linux'
        run: flutter build linux --release --dart-define-from-file=.env.dart.define.json

      - name: Upload Android app bundle
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload iOS app bundle
        if: matrix.platform == 'ios' && (secrets.IOS_DIST_CERT_P12_BASE64 == '' || secrets.IOS_DIST_CERT_PASSWORD == '' || secrets.IOS_KEYCHAIN_PASSWORD == '' || secrets.IOS_TEAM_ID == '' || secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 == '' || secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 == '')
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-ios-runner-app
          path: build/ios/iphoneos/Runner.app

      - name: Upload signed iOS IPA
        if: matrix.platform == 'ios' && secrets.IOS_DIST_CERT_P12_BASE64 != '' && secrets.IOS_DIST_CERT_PASSWORD != '' && secrets.IOS_KEYCHAIN_PASSWORD != '' && secrets.IOS_TEAM_ID != '' && secrets.IOS_PROVISIONING_PROFILE_APP_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_EXTENSION_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-ios-adhoc-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload macOS app bundle
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-macos-app
          path: build/macos/Build/Products/Release/password_manager.app

      - name: Upload Windows release bundle
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-windows-release
          path: build/windows/x64/runner/Release

      - name: Upload Linux release bundle
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: password_manager-linux-release
          path: build/linux/x64/release/bundle

      - name: Upload browser extension package
        if: matrix.platform == 'browser-extension'
        uses: actions/upload-artifact@v4
        with:
          name: keyvault-browser-extension
          path: desktop/browser_extension/dist/keyvault-browser-extension.zip

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          shopt -s nullglob
          for artifact_dir in release-artifacts/*; do
            artifact_name="$(basename "${artifact_dir}")"

            if [ ! -d "${artifact_dir}" ]; then
              continue
            fi

            entries=("${artifact_dir}"/*)

            if [ ${#entries[@]} -eq 1 ] && [ -f "${entries[0]}" ]; then
              cp "${entries[0]}" "release-files/"
            else
              (
                cd release-artifacts
                zip -r "../release-files/${artifact_name}.zip" "${artifact_name}" >/dev/null
              )
            fi
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
