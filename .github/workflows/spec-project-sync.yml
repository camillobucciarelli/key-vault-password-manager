name: Spec project sync

on:
  push:
    branches: [main]
    paths:
      - 'specs/**'
      - 'tool/sync_spec_project.sh'
      - '.github/workflows/spec-project-sync.yml'
  # Base-branch code only: safe access to PROJECTS_TOKEN while reflecting PR
  # lifecycle immediately, including PRs from forks.
  pull_request_target:
    types: [opened, reopened, synchronize, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:

concurrency:
  group: spec-project-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Sync specs to issues and board
        env:
          # Needs Projects read/write; the default GITHUB_TOKEN cannot write
          # user-level Projects v2.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_NUMBER: ${{ vars.SPEC_PROJECT_NUMBER }}
        run: tool/sync_spec_project.sh
