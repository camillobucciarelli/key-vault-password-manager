name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - run: flutter pub get
      # Golden tests excluded: reference PNGs generated on macOS (dev
      # machine); font rasterization differs on Linux CI, producing
      # false-positive pixel diffs unrelated to logic regressions.
      # Goldens remain a local pre-push check per AGENTS.md.
      - run: flutter test $(find test -name '*_test.dart' ! -path 'test/goldens/*')

  # Windows is the only supported platform whose filesystem semantics the code
  # actually depends on AND that no PR check has ever exercised: `release.yml`
  # builds on `windows-2022`, but that runs after merge, so a Windows-only
  # divergence is found by a release, not by a review. What this job is looking
  # for, concretely:
  #   - `File.rename` onto a target another handle has open fails with
  #     ERROR_ACCESS_DENIED on Windows where POSIX `rename(2)` succeeds. That is
  #     the exact primitive `SafeVaultFileWriter` uses for its atomic replace.
  #   - `\` as separator, and case-insensitive path comparison, which
  #     `PortablePath` containment folds on.
  #   - `SafeVaultFileWriter` classifies Windows as "never app-private" and so
  #     resolves symlinks there, a branch nothing else runs.
  # Same runner label as the release job on purpose: a green PR here should mean
  # the release build's host agrees.
  test-windows:
    runs-on: windows-2022
    # Blocking as of the change that emptied the quarantine. `continue-on-error`
    # was the right call while 8 files were excluded and one red was known: the
    # job could not have been required without either lying or blocking every
    # PR. Both reasons are now gone — the excluded files were fixed rather than
    # skipped, the one red carries an explicit per-test `skip:` with its reason,
    # and the suite is green on windows-2022 (1187 + 34 passed, 10 skipped, and
    # every skip is a `skip:` that names why).
    #
    # Leaving it non-blocking past that point would defeat the purpose: a job
    # nobody has to satisfy is a job that rots, which is exactly what the
    # `after merge, in release.yml` situation was before #114.
    #
    # NOTE: this only makes a Windows failure fail the WORKFLOW RUN. Adding
    # `test-windows` to the branch's required status checks is a repository
    # setting and has to be done in branch protection separately.
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          # Single source of truth for the pinned Flutter version: .fvmrc.
          # Do not add `flutter-version:` alongside it — the action rejects
          # both at once, and a second copy is how local and CI drift apart.
          channel: stable
          flutter-version-file: .fvmrc

      - run: flutter pub get

      # Three QA suites build a `/var`→`/private/var`-style divergence with
      # `Link.create`. On Windows that needs SeCreateSymbolicLinkPrivilege,
      # which normally means Developer Mode or an elevated shell — and the
      # runner-images docs make no promise either way. So we MEASURE it here
      # instead of assuming, and the answer drives the two steps below.
      #
      # MEASURED ANSWER, run 32596328624 on windows-2022: SYMLINK_CAPABLE=true.
      # GitHub-hosted Windows runners CAN create symlinks, so all three suites
      # really do run here. The probe stays anyway: it is what makes that a
      # fact rather than an assumption, and it is what turns a future runner
      # image change into an explicit "NOT RUN" report instead of a mystery.
      - name: Probe whether this runner can create symlinks
        id: symlink
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/symlink_probe.dart" <<'DART'
          import 'dart:io';

          void main() {
            final root = Directory.systemTemp.createTempSync('symlink_probe_');
            try {
              final target = Directory('${root.path}/target')..createSync();
              Link('${root.path}/link').createSync(target.path);
              print('SYMLINK_CAPABLE=true');
            } catch (error) {
              print('SYMLINK_CAPABLE=false');
              print('reason: $error');
            } finally {
              root.deleteSync(recursive: true);
            }
          }
          DART
          dart "${RUNNER_TEMP}/symlink_probe.dart" | tee "${RUNNER_TEMP}/probe.txt"
          if grep -q 'SYMLINK_CAPABLE=true' "${RUNNER_TEMP}/probe.txt"; then
            echo "capable=true" >> "$GITHUB_OUTPUT"
          else
            echo "capable=false" >> "$GITHUB_OUTPUT"
          fi

      # The quarantine is GONE. The first Windows run (32596328624) failed 22
      # tests across 8 files; every one was a POSIX assumption in the test, and
      # all 8 files were fixed rather than excluded — hard-coded `/` separators
      # replaced with `p.join`, a hand-written JSON fixture rebuilt with
      # `jsonEncode`, the meta-test's `lib/...` keys normalised through
      # `p.posix`, and the fault-injection harness taught to emit the OS error
      # codes of the HOST instead of POSIX errnos. The three cases that are
      # genuinely inexpressible on Windows carry a `skip:` with the reason in
      # the test itself, where the runner reports them as skipped rather than
      # silently absent.
      #
      # One production defect came out of this and is fixed in the same change:
      # `BrowserSetupService` built its display command with the host separator
      # while rendering for a caller-chosen `platformOverride`, so a Windows
      # host produced `./desktop\native_host/install_host_macos.sh`.
      #
      # If a Windows failure appears here again, it is new information. Fix it
      # or quarantine it with a written reason — do not edit the assertion to
      # match whatever Windows happens to do.
      - name: Flutter test (Windows)
        id: suite
        shell: bash
        run: |
          mapfile -t suites < <(
            find test -name '*_test.dart' \
              ! -path 'test/goldens/*' \
              ! -path 'test/features/password_manager/data/portable_path_symlink_qa_test.dart' \
              ! -path 'test/core/utils/mobile_file_storage_guard_qa_test.dart' \
              ! -path 'test/core/utils/mobile_file_storage_guard_bypass_qa_test.dart'
          )
          (( ${#suites[@]} > 0 )) || { echo "No test files matched"; exit 1; }
          flutter test "${suites[@]}"

      # These three build a `/var`->`/private/var` divergence with `Link.create`
      # and are run apart from the main suite purely so their outcome is legible
      # on its own. Run 32597088754 measured 34 passed / 1 failed; the single
      # failure was the `package:path` case-insensitivity limitation, which now
      # carries an explicit `skip:` in the test, so this step is expected green.
      - name: Flutter test (symlink QA suites)
        # `always()` so a failure in the step above cannot turn this into a
        # skip. A skipped step reads as "fine" at a glance, and these three
        # suites are precisely the ones whose Windows status we are here to
        # establish — they must report their own result either way.
        if: always() && steps.symlink.outputs.capable == 'true'
        shell: bash
        run: |
          flutter test \
            test/features/password_manager/data/portable_path_symlink_qa_test.dart \
            test/core/utils/mobile_file_storage_guard_qa_test.dart \
            test/core/utils/mobile_file_storage_guard_bypass_qa_test.dart

      # A test that did not run must never look like a test that passed. When
      # the probe says this runner cannot create symlinks, the step above is
      # skipped and this one states exactly which suites went unverified, as a
      # warning annotation on the job — not as a silent green tick.
      - name: Report unrun symlink QA suites
        if: always() && steps.symlink.outputs.capable != 'true'
        shell: bash
        run: |
          echo "::warning title=Symlink QA suites NOT RUN on Windows::\
          This runner cannot create symlinks (no SeCreateSymbolicLinkPrivilege / \
          Developer Mode), so portable_path_symlink_qa, \
          mobile_file_storage_guard_qa and mobile_file_storage_guard_bypass_qa \
          were skipped. They are UNVERIFIED on Windows, not passing."
          {
            echo "### Windows: symlink QA suites NOT RUN"
            echo
            echo "\`Link.create\` is unavailable on this runner. Probe output:"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/probe.txt"
            echo '```'
            echo
            echo "Unverified on Windows:"
            echo "- \`test/features/password_manager/data/portable_path_symlink_qa_test.dart\`"
            echo "- \`test/core/utils/mobile_file_storage_guard_qa_test.dart\`"
            echo "- \`test/core/utils/mobile_file_storage_guard_bypass_qa_test.dart\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate from the Flutter jobs on purpose: these checks share no toolchain
  # with them, so a failure here names the extension directly instead of hiding
  # inside a red `test` job, and it does not wait on `flutter pub get`.
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned, not `latest`: Node 24 is the current Active LTS (maintained to
      # 2026-04) and matches the local dev version, so CI and local runs of the
      # built-in runner agree. Node 20 is already EOL. `node --test` needs >= 18.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Gate A0 of spec 009. `shopt -s failglob` is load-bearing: with bash's
      # default behaviour an unmatched glob is passed through *literally*, and
      # `node --test` then reports "tests 0" and exits 0 — a green check that
      # verified nothing. failglob aborts the step instead. (`nullglob` would be
      # just as wrong: the pattern vanishes and the run still exits 0.)
      - name: Gate A0 - browser extension security harness
        shell: bash
        run: |
          shopt -s failglob
          node --test desktop/browser_extension/test/*.test.js

      # Syntax gate from A045. This is an explicit allowlist, not a glob: a
      # runtime file that is never named here is simply never checked, and
      # nothing fails to say so. Every task that adds a runtime JS file to
      # desktop/browser_extension/ adds it to this list in the same commit
      # (Slice A2 added overlay_lifecycle.js and content_overlay.js; the latter
      # is a bootstrap-only stub until Slice A4 fills it in. Slice A3 added
      # overlay_routes.js).
      # `overlay_lifecycle.test.js` asserts this list stays complete, and does
      # so by reading the directory rather than by naming files, so a new
      # runtime file fails that test instead of being silently skipped here.
      - name: Syntax check extension sources
        shell: bash
        run: |
          node --check desktop/browser_extension/overlay_security.js
          node --check desktop/browser_extension/overlay_lifecycle.js
          node --check desktop/browser_extension/overlay_routes.js
          node --check desktop/browser_extension/content_overlay.js
          node --check desktop/browser_extension/background.js
          node --check desktop/browser_extension/popup.js

      # Keeps the mutation definitions honest without running them.
      #
      # `--dry-run` applies every mutation to the real sources, restores each
      # one, and verifies the restore byte-for-byte. It runs NO tests, so it
      # costs well under a second and needs no Flutter toolchain. What it
      # catches is the failure mode that silently rots a mutation table: a
      # refactor moves the code a definition targets, the literal `find` stops
      # matching, and the mutation quietly tests nothing while still printing a
      # kill count. That is a hard error here, and it is the same class of bug
      # as the `failglob` trap above — a check that passes by doing nothing.
      #
      # The FULL run (`--check`, ~20s) is deliberately NOT wired in yet. It is
      # green today, but a brand-new gate that blocks every PR the first time it
      # produces a false positive is a gate that gets switched off. It earns its
      # place in CI after it has run for a few cycles and we know its stability,
      # and it should land as its own change so the failure is legible when it
      # first fires.
      - name: Mutation definitions still match the sources
        shell: bash
        run: node tool/mutation_runner.mjs --dry-run

  dependency-audit:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
