name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      # Golden tests excluded: reference PNGs generated on macOS (dev
      # machine); font rasterization differs on Linux CI, producing
      # false-positive pixel diffs unrelated to logic regressions.
      # Goldens remain a local pre-push check per AGENTS.md.
      - run: flutter test $(find test -name '*_test.dart' ! -path 'test/goldens/*')

  # Separate from the Flutter jobs on purpose: these checks share no toolchain
  # with them, so a failure here names the extension directly instead of hiding
  # inside a red `test` job, and it does not wait on `flutter pub get`.
  extension-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Pinned, not `latest`: Node 24 is the current Active LTS (maintained to
      # 2026-04) and matches the local dev version, so CI and local runs of the
      # built-in runner agree. Node 20 is already EOL. `node --test` needs >= 18.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Gate A0 of spec 009. `shopt -s failglob` is load-bearing: with bash's
      # default behaviour an unmatched glob is passed through *literally*, and
      # `node --test` then reports "tests 0" and exits 0 — a green check that
      # verified nothing. failglob aborts the step instead. (`nullglob` would be
      # just as wrong: the pattern vanishes and the run still exits 0.)
      - name: Gate A0 - browser extension security harness
        shell: bash
        run: |
          shopt -s failglob
          node --test desktop/browser_extension/test/*.test.js

      # Syntax gate from A045. This is an explicit allowlist, not a glob: a
      # runtime file that is never named here is simply never checked, and
      # nothing fails to say so. Every task that adds a runtime JS file to
      # desktop/browser_extension/ adds it to this list in the same commit
      # (Slice A2 added overlay_lifecycle.js and content_overlay.js; the latter
      # is a bootstrap-only stub until Slice A4 fills it in. Slice A3 added
      # overlay_routes.js).
      # `overlay_lifecycle.test.js` asserts this list stays complete, and does
      # so by reading the directory rather than by naming files, so a new
      # runtime file fails that test instead of being silently skipped here.
      - name: Syntax check extension sources
        shell: bash
        run: |
          node --check desktop/browser_extension/overlay_security.js
          node --check desktop/browser_extension/overlay_lifecycle.js
          node --check desktop/browser_extension/overlay_routes.js
          node --check desktop/browser_extension/content_overlay.js
          node --check desktop/browser_extension/background.js
          node --check desktop/browser_extension/popup.js

      # Keeps the mutation definitions honest without running them.
      #
      # `--dry-run` applies every mutation to the real sources, restores each
      # one, and verifies the restore byte-for-byte. It runs NO tests, so it
      # costs well under a second and needs no Flutter toolchain. What it
      # catches is the failure mode that silently rots a mutation table: a
      # refactor moves the code a definition targets, the literal `find` stops
      # matching, and the mutation quietly tests nothing while still printing a
      # kill count. That is a hard error here, and it is the same class of bug
      # as the `failglob` trap above — a check that passes by doing nothing.
      #
      # The FULL run (`--check`, ~20s) is deliberately NOT wired in yet. It is
      # green today, but a brand-new gate that blocks every PR the first time it
      # produces a false positive is a gate that gets switched off. It earns its
      # place in CI after it has run for a few cycles and we know its stability,
      # and it should land as its own change so the failure is legible when it
      # first fires.
      - name: Mutation definitions still match the sources
        shell: bash
        run: node tool/mutation_runner.mjs --dry-run

  dependency-audit:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    with:
      scan-args: |-
        --lockfile=pubspec.lock
    permissions:
      contents: read
      actions: read
      security-events: write

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
