name: Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      build_number: ${{ steps.bump.outputs.build_number }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - id: bump
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          OLD_BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          BUILD_NUMBER=$((OLD_BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${TAG}"
          git tag "$TAG"
          git push origin main --tags

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Setup Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms android

      - name: Upload APK to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-android-release.apk

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms linux

      - name: Upload Linux bundle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-linux-release.zip

  ios:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build App Store artifact
        run: ./tool/build_prod_packages.sh --platforms ios-appstore

      - name: Upload iOS artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-ios-appstore.ipa

      - name: Locate xcarchive
        id: locate
        run: |
          shopt -s nullglob
          archive=(dist/prod_packages/*/Runner-ios.xcarchive)
          (( ${#archive[@]} == 1 )) || { echo "Expected one iOS archive, found ${#archive[@]}"; exit 1; }
          echo "archive_dir=$(dirname "${archive[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ${{ steps.locate.outputs.archive_dir }}/Runner-ios.xcarchive
          retention-days: 1

  ios-app-store-publish:
    needs: [ version, ios ]
    runs-on: self-hosted
    environment: app-store-ios
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - uses: actions/download-artifact@v8
        with:
          name: ios-xcarchive
          path: dist/ios-xcarchive

      - name: Upload to App Store Connect
        run: |
          # actions/upload-artifact flattens a single-directory path, so the
          # downloaded content IS the xcarchive contents (no nested folder).
          ./tool/build_prod_packages.sh \
            --platforms ios-appstore-upload \
            --archive-path dist/ios-xcarchive \
            --no-clean

  macos:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build App Store artifact
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: ./tool/build_prod_packages.sh --platforms macos-appstore

      - name: Upload macOS artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-macos-appstore.pkg

      - name: Build macOS Chrome Support installer
        env:
          NATIVE_HOST_PACKAGE_VERSION: ${{ needs.version.outputs.version_name }}.${{ needs.version.outputs.build_number }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: bash tool/package_native_host_macos.sh

      - name: Upload macOS Chrome Support installer to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/keyvault-chrome-support-macos.pkg
          fail_on_unmatched_files: true

      - name: Archive xcarchive as tar
        id: locate
        run: |
          # actions/upload-artifact's zip packaging mangles symlinks/permissions
          # inside the .app bundle (Contents/Versions symlinks etc.), which makes
          # xcodebuild -exportArchive fail with "contains invalid products" when
          # the archive is re-downloaded in a different job. tar preserves them
          # byte-for-byte.
          shopt -s nullglob
          archive=(dist/prod_packages/*/Runner.xcarchive)
          (( ${#archive[@]} == 1 )) || { echo "Expected one macOS archive, found ${#archive[@]}"; exit 1; }
          tar -czf dist/macos-xcarchive.tar.gz -C "$(dirname "${archive[0]}")" "Runner.xcarchive"

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-xcarchive
          path: dist/macos-xcarchive.tar.gz
          retention-days: 1

  macos-app-store-publish:
    needs: [ version, macos ]
    runs-on: self-hosted
    environment: app-store-macos
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - uses: actions/download-artifact@v8
        with:
          name: macos-xcarchive
          path: dist

      - name: Extract xcarchive
        run: tar -xzf dist/macos-xcarchive.tar.gz -C dist

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_PATH: ${{ secrets.APP_STORE_CONNECT_API_KEY_PATH }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          ./tool/build_prod_packages.sh \
            --platforms macos-appstore-upload \
            --archive-path dist/Runner.xcarchive \
            --no-clean

  chrome:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Build extension artifact
        env:
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          [[ "${BUILD_NUMBER}" =~ ^[0-9]+$ ]] && (( BUILD_NUMBER <= 65535 )) || {
            echo "Chrome extension build number must be between 0 and 65535"
            exit 1
          }
          base_version=$(jq -r '.version' desktop/browser_extension/manifest.json | cut -d. -f1-3)
          jq --arg version "${base_version}.${BUILD_NUMBER}" \
            '.version = $version' \
            desktop/browser_extension/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json desktop/browser_extension/manifest.json
          ./desktop/browser_extension/package_extension.sh

      - name: Upload extension artifact to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: desktop/browser_extension/dist/keyvault-browser-extension.zip

      - name: Upload extension zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-zip
          path: desktop/browser_extension/dist/keyvault-browser-extension.zip
          retention-days: 1

  chrome-web-store-publish:
    needs: [ version, chrome ]
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: chrome-extension-zip
          path: desktop/browser_extension/dist

      - name: Upload and publish Chrome extension
        env:
          CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_WEB_STORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CHROME_WEB_STORE_EXTENSION_ID }}
        run: |
          : "${CLIENT_ID:?Missing CHROME_WEB_STORE_CLIENT_ID secret}"
          : "${CLIENT_SECRET:?Missing CHROME_WEB_STORE_CLIENT_SECRET secret}"
          : "${REFRESH_TOKEN:?Missing CHROME_WEB_STORE_REFRESH_TOKEN secret}"
          : "${PUBLISHER_ID:?Missing CHROME_WEB_STORE_PUBLISHER_ID secret}"
          : "${EXTENSION_ID:?Missing CHROME_WEB_STORE_EXTENSION_ID secret}"
          [[ "${EXTENSION_ID}" == "ogjmlkogmogijgpflnjifiobdmnmommh" ]] || {
            echo "CHROME_WEB_STORE_EXTENSION_ID does not match the published KeyVault extension"
            exit 1
          }

          token_response=$(curl --fail-with-body --silent --show-error \
            https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          access_token=$(jq -er '.access_token' <<<"${token_response}")

          upload_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -X POST \
            -T desktop/browser_extension/dist/keyvault-browser-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload")
          upload_state=$(jq -er '.uploadState' <<<"${upload_response}")

          for _ in {1..60}; do
            [[ "${upload_state}" == "SUCCEEDED" ]] && break
            [[ "${upload_state}" == "IN_PROGRESS" ]] || {
              echo "Chrome Web Store upload failed: ${upload_state}"
              exit 1
            }
            sleep 5
            status_response=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${access_token}" \
              "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:fetchStatus")
            upload_state=$(jq -er '.lastAsyncUploadState' <<<"${status_response}")
          done

          [[ "${upload_state}" == "SUCCEEDED" ]] || {
            echo "Chrome Web Store upload timed out"
            exit 1
          }

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${access_token}" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json
        shell: bash

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms windows --no-clean
        shell: bash

      - name: Zip Windows bundle
        run: |
          $src = Get-ChildItem -Path dist\prod_packages -Recurse -Filter "password_manager-windows-release" -Directory | Select-Object -First 1
          $required = @(
            'desktop\native_host\install_host_windows.ps1',
            'desktop\native_host\keyvault_native_host.exe',
            'desktop\native_host\manifests\chrome\dev.camillobucciarelli.keyvault_native_host.json'
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $src.FullName $path))) {
              throw "Missing Windows bundle file: $path"
            }
          }
          Compress-Archive -Path "$($src.FullName)\*" -DestinationPath "$($src.Parent.FullName)\password_manager-windows-release.zip" -Force
        shell: pwsh

      - name: Upload Windows bundle to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-windows-release.zip
