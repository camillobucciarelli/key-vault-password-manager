name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.parse.outputs.version_name }}
      build_number: ${{ steps.parse.outputs.build_number }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER="$RUN_NUMBER"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Setup Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Set build number
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms android

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-android-release.apk

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Set build number
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms linux

      - name: Upload Linux bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-linux-release.zip

  ios:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Set build number
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Build and upload to App Store
        run: ./tool/build_prod_packages.sh --platforms ios-appstore

  macos:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Set build number
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Build and upload to App Store
        run: ./tool/build_prod_packages.sh --platforms macos-appstore

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json
        shell: bash

      - name: Set build number
        env:
          VERSION_NAME: ${{ needs.version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          (Get-Content pubspec.yaml) `
            -replace '^version: .*', "version: $env:VERSION_NAME+$env:BUILD_NUMBER" |
          Set-Content pubspec.yaml
        shell: pwsh

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms windows
        shell: bash

      - name: Upload Windows bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-windows-release.zip
