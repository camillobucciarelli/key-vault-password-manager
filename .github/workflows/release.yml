name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pubspec.yaml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.version_name }}
      build_number: ${{ steps.bump.outputs.build_number }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - id: bump
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo "$CURRENT" | cut -d'+' -f1)
          OLD_BUILD=$(echo "$CURRENT" | cut -d'+' -f2)
          BUILD_NUMBER=$((OLD_BUILD + 1))
          sed -i "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${TAG}"
          git tag "$TAG"
          git push origin main --tags

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Setup Android keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_PASSWORD" > android/key.properties

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms android

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-android-release.apk

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms linux

      - name: Upload Linux bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-linux-release.zip

  ios:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build and upload to App Store
        run: ./tool/build_prod_packages.sh --platforms ios-appstore

  macos:
    needs: version
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json

      - name: Build and upload to App Store
        run: ./tool/build_prod_packages.sh --platforms macos-appstore

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup env file
        env:
          ENV_DART_DEFINE: ${{ secrets.ENV_DART_DEFINE }}
        run: echo "$ENV_DART_DEFINE" > .env.dart.define.json
        shell: bash

      - name: Build
        run: ./tool/build_prod_packages.sh --platforms windows
        shell: bash

      - name: Upload Windows bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/prod_packages/*/password_manager-windows-release.zip
