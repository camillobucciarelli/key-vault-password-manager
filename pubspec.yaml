name: password_manager
description: "A new Flutter project."
publish_to: "none"
version: 0.6.0+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  equatable: ^3.0.0
  # Held at 11.x: from 12.0 `saveFile` requires `bytes` and writes the file
  # itself (no path-only save dialog). Exports and new-database paths here
  # pick a path, then write through DatabaseFileRepository / DatabasePathMutex
  # / the safe writer; adopting 12+ needs a design for that, not a bump.
  file_picker: ^11.0.3
  flutter_bloc: ^9.1.1
  # Held at 10.x: every 11.x needs win32 ^6 (via flutter_secure_storage_windows
  # 4.2.2), which only file_picker >=12 accepts. Moves together with file_picker.
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  get_it: ^9.3.0
  google_fonts: ^9.0.0
  crypto: ^3.0.7
  http: ^1.6.0
  kdbx: ^2.5.0
  local_auth: ^3.0.2
  loggy: ^2.0.3
  otp: ^3.2.1
  mobile_scanner: ^7.4.2
  oauth2: ^2.0.5
  path: ^1.9.1
  path_provider: ^2.1.6
  # Already resolved transitively via `kdbx` at the same version; declared
  # explicitly because spec 014's metadata cipher (AES-256-GCM over the
  # registry/security/sync metadata files) imports it directly — code in
  # `lib/` must not import a package it does not declare. Same pattern and
  # justification as `xml` below.
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  stream_transform: ^2.1.2
  url_launcher: ^6.3.3
  # Already resolved transitively via `kdbx` at the same version; declared
  # explicitly because the spec 008 merge adapter and its semantic manifest
  # read KDBX constructs the library does not model (entry colors, entry
  # AutoType) straight off the public, exported `KdbxNode.node`. Promoted from
  # `dev_dependencies` in Phase 3 slice 2, exactly as the note there said it
  # would be when the adapter landed in `lib/`.
  # Held at 6.x: kdbx 2.5.0 (latest) constrains xml <7.0.0.
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-demand only: drives integration_test/ios_portable_paths_qa_test.dart on a
  # real iOS runtime. No CI job runs it (see AGENTS.md > Testing Guidelines);
  # `flutter test` never collects integration_test/.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Virtual time for the pending-generation expiry tests: their assertions sit
  # in a sub-second window between two TTLs, which a real sleep can only land
  # inside while the process is never descheduled for long. Test-only; already
  # present transitively via flutter_test, declared here so the import is
  # legitimate rather than an implicit dependency.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # Used only by the C-7 import gate test
  # (test/.../database_session_coordinator_imports_test.dart).
  # analyzer's `meta` floor must stay satisfiable by the meta that
  # flutter_test pins in the .fvmrc SDK; re-check `flutter pub get` on a
  # toolchain bump.
  analyzer: ^14.5.0

flutter:
  # Per-project switch (overrides `flutter config`): every iOS/macOS plugin
  # ships a Package.swift, so CocoaPods is not used. Keeps CI and the
  # self-hosted release runners independent of their global Flutter config.
  config:
    enable-swift-package-manager: true
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/icons/lucide/
    - assets/logo/app_icon_family/keyvault-source-1024.png
    # spec-019 FR-016: the rail and tab bar show the app's own mark, not a
    # stand-in key glyph (C-SH-03).
    - assets/logo/app_icon_family/keyvault-mark-monochrome.svg
    # Full-colour variant of the same mark (verbatim copy of
    # specs/_design/keyvault-mark-foreground.svg, sha pinned there) for the
    # rail tile. Lives outside app_icon_family/, whose inventory the icon
    # build tool owns exactly.
    - assets/logo/keyvault-mark-color.svg
  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
          weight: 400
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/logo/app_icon_family/keyvault-source-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android adaptive icons (API 26+)
  adaptive_icon_background: "#FFE1D0"
  adaptive_icon_foreground: assets/logo/app_icon_family/keyvault-adaptive-foreground-1024.png
  adaptive_icon_monochrome: assets/logo/app_icon_family/keyvault-monochrome-1024.png
  # iOS: dark/tinted variants for iOS 18+
  image_path_ios_dark_transparent: assets/logo/app_icon_family/keyvault-adaptive-foreground-1024.png
  image_path_ios_tinted_grayscale: assets/logo/app_icon_family/keyvault-monochrome-1024.png
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: false
  windows:
    generate: true
  macos:
    generate: true
