name: password_manager
description: "A new Flutter project."
publish_to: "none"
version: 0.3.0+178

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.1
  equatable: ^2.1.0
  file_picker: ^11.0.2
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.3.0
  google_sign_in: ^7.2.0
  get_it: ^9.2.1
  google_fonts: ^8.2.1
  crypto: ^3.0.7
  http: ^1.6.0
  kdbx: ^2.5.0
  local_auth: ^3.0.2
  loggy: ^2.0.3
  otp: ^3.2.0
  mobile_scanner: ^7.4.0
  oauth2: ^2.0.5
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2
  # Already resolved transitively via `kdbx` at the same version; declared
  # explicitly because the spec 008 merge adapter and its semantic manifest
  # read KDBX constructs the library does not model (entry colors, entry
  # AutoType) straight off the public, exported `KdbxNode.node`. Promoted from
  # `dev_dependencies` in Phase 3 slice 2, exactly as the note there said it
  # would be when the adapter landed in `lib/`.
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-demand only: drives integration_test/ios_portable_paths_qa_test.dart on a
  # real iOS runtime. No CI job runs it (see AGENTS.md > Testing Guidelines);
  # `flutter test` never collects integration_test/.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Virtual time for the pending-generation expiry tests: their assertions sit
  # in a sub-second window between two TTLs, which a real sleep can only land
  # inside while the process is never descheduled for long. Test-only; already
  # present transitively via flutter_test, declared here so the import is
  # legitimate rather than an implicit dependency.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # Used only by the C-7 import gate test
  # (test/.../database_session_coordinator_imports_test.dart).
  # Do NOT raise to ^14 without checking `flutter pub get` still resolves:
  # analyzer 14 needs meta ^1.18.3, while flutter_test from the pinned Flutter
  # version (.fvmrc: 3.44.8) ships meta 1.18.0.
  analyzer: ^14.1.0  # pinned: analyzer >=14 needs meta ^1.18.3, but the pinned Flutter SDK (fvm, 3.44.8) ships flutter_test with meta 1.18.0 — see PR #32. Revisit when the toolchain pin moves.

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/icons/lucide/
    - assets/logo/app_icon_family/keyvault-source-1024.png
    # spec-019 FR-016: the rail and tab bar show the app's own mark, not a
    # stand-in key glyph (C-SH-03).
    - assets/logo/app_icon_family/keyvault-mark-monochrome.svg
  fonts:
    - family: Caprasimo
      fonts:
        - asset: assets/fonts/Caprasimo-Regular.ttf
          weight: 400
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: assets/logo/app_icon_family/keyvault-source-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  # Android adaptive icons (API 26+)
  adaptive_icon_background: "#FFE1D0"
  adaptive_icon_foreground: assets/logo/app_icon_family/keyvault-adaptive-foreground-1024.png
  adaptive_icon_monochrome: assets/logo/app_icon_family/keyvault-monochrome-1024.png
  # iOS: dark/tinted variants for iOS 18+
  image_path_ios_dark_transparent: assets/logo/app_icon_family/keyvault-adaptive-foreground-1024.png
  image_path_ios_tinted_grayscale: assets/logo/app_icon_family/keyvault-monochrome-1024.png
  desaturate_tinted_to_grayscale_ios: true
  web:
    generate: false
  windows:
    generate: true
  macos:
    generate: true
