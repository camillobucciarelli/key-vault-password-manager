<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KeyVault Autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>KeyVault Autofill</h1>

      <p class="hint">
        Native Messaging v2 uses app-published metadata only. Password reveal/fill is disabled in the native host.
      </p>

      <section class="status-grid" aria-live="polite">
        <article class="status-card">
          <span class="status-label">Native host</span>
          <strong id="hostStatus">Not checked</strong>
        </article>
        <article class="status-card">
          <span class="status-label">App / vault bridge</span>
          <strong id="appStatus">Not connected</strong>
        </article>
      </section>

      <button id="statusButton" type="button">Check host status</button>
      <button id="queryButton" type="button">Find current site</button>

      <label class="search-label" for="searchInput">Global metadata search</label>
      <div class="search-row">
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search title, user, service" />
        <button id="searchButton" type="button">Search</button>
      </div>
      <p id="status" class="status"></p>

      <section>
        <h2>Matches</h2>
        <div id="results" class="results"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
